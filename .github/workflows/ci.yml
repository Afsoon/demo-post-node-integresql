name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Check migrations are in sync with the drizzle schema
        # `generate` only diffs the schema against the last snapshot (no DB). Anything it would
        # write means someone changed src/infra/db/schema without generating a migration.
        run: |
          pnpm drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle schema and migrations are out of sync:"; git status --porcelain drizzle; exit 1
          fi

  test-all:
    name: tests (full suite)
    uses: ./.github/workflows/test.yml

  test-sharded:
    name: tests (shard ${{ matrix.shard }}/3)
    needs: test-all
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/test.yml
    with:
      shard: ${{ matrix.shard }}
