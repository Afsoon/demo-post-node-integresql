name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHARDS: 3

jobs:
  check:
    name: typecheck · migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Check migrations are in sync with the drizzle schema
        # `generate` only diffs the schema against the last snapshot (no DB). Anything it would
        # write means someone changed src/infra/db/schema without generating a migration.
        run: |
          pnpm drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::drizzle schema and migrations are out of sync:"; git status --porcelain drizzle; exit 1
          fi

  test:
    name: tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: "true"
      # .env.test is loaded with process.loadEnvFile, which never overrides variables already set:
      # Fresh TimescaleDB per run; pgtest remains available for failure diagnostics.
      TESTCONTAINERS_REUSE_ENABLE: "false"
      # Hosted runners need a published image; locally the alpha image can already exist.
      PGTEST_IMAGE: ${{ vars.PGTEST_IMAGE || 'pgtest-tokio-size-validation:local' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore test images
        # one tarball shared by every shard and push; the key follows the image tags pinned in
        # test/globalSetup.ts, so bumping a tag invalidates it
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ env.PGTEST_IMAGE }}-${{ hashFiles('test/globalSetup.ts') }}

      - name: Load or pull test images
        # keeps image pulls out of vitest's globalSetup hookTimeout; on a miss the pulled images are
        # saved so later runs (and the sibling shards' next run) can `docker load` them
        env:
          TARBALL: ${{ runner.temp }}/test-images/images.tar
        run: |
          if [ -f "$TARBALL" ]; then
            docker load -i "$TARBALL"
          else
            docker pull timescale/timescaledb:2.29.2-pg18
            docker image inspect "$PGTEST_IMAGE" >/dev/null 2>&1 || docker pull "$PGTEST_IMAGE"
            mkdir -p "$(dirname "$TARBALL")"
            docker save -o "$TARBALL" timescale/timescaledb:2.29.2-pg18 "$PGTEST_IMAGE"
          fi

      - name: Run shard
        # blob reporter → .vitest-reports/blob-<i>-<n>.json (uploaded below, mergeable on demand);
        # the default reporter keeps live output in this job's log
        run: pnpm vitest run --shard=${{ matrix.shard }}/${{ env.SHARDS }} --reporter=blob --reporter=default

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest-reports/
          # upload-artifact ignores dot-prefixed paths unless told otherwise
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Container logs (on failure)
        if: failure()
        run: |
          docker ps -a --filter label=demo.blog.service=metered
          for c in $(docker ps -aq --filter label=demo.blog.service=metered); do
            echo "===== $c"; docker logs "$c" 2>&1 | tail -200
          done
